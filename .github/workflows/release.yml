name: release

on:
  push:
    branches: [master]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Users install the `release` branch or a version tag with `pi install git:…`; see
  # docs/development.md.
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # queue: max keeps every pending job. With the default single queue, a late older run
    # cancels the pending job for the current commit, and then nothing publishes it.
    concurrency:
      group: release-branch
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node .scripts/build-release.ts "$RUNNER_TEMP/release"
      - name: Commit the build to the release branch and tag its version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Runs can reach this job out of order, and an old run can be rerun. While this job
          # holds the release-branch lock, publish only the current head of the branch, so an
          # older build never replaces a newer one.
          head=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Skipping this build because $GITHUB_REF is now at $head, not $GITHUB_SHA."
            exit 0
          fi
          # A separate index stages the build tree; its .gitignore leaves out node_modules.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git --work-tree="$RUNNER_TEMP/release" add --all
          tree=$(git write-tree)
          commit=""
          parent=()
          # No parent on the first run. If the fetch fails for another reason, the push below
          # is not a fast-forward and fails.
          if git fetch --depth=1 origin release; then
            if [ "$tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
              echo "The release branch already has this build."
              commit=$(git rev-parse FETCH_HEAD)
            else
              parent=(-p FETCH_HEAD)
            fi
          fi
          if [ -z "$commit" ]; then
            commit=$(git commit-tree "$tree" "${parent[@]}" -m "chore(release): build $GITHUB_SHA")
            git push origin "$commit:refs/heads/release"
          fi
          # Tag the first build of each version. Tags never move: the push without --force
          # fails instead of replacing a tag. This also runs for an unchanged tree, so a rerun
          # adds a tag that an earlier run did not push.
          tag="v$(node -p "require(process.env.RUNNER_TEMP + '/release/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
          else
            git tag -a "$tag" -m "$tag" "$commit"
            git push origin "refs/tags/$tag"
          fi
