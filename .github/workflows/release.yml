name: release

on:
  push:
    branches: [master]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Users install the `release` branch or a version tag with `pi install git:…`; see docs/development.md.
  release:
    needs: check
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # queue: max keeps every pending job. With the default single queue, a late older run cancels the pending job for the current commit, and then nothing publishes it.
    concurrency:
      group: release-branch
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node .scripts/build-release.ts
      - name: Commit the build to the release branch and tag its version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Runs can reach this job out of order, and an old run can be rerun. While this job holds the release-branch lock, publish only the current head of the branch, so an older build never replaces a newer one.
          head=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Skipping this build because $GITHUB_REF is now at $head, not $GITHUB_SHA."
            exit 0
          fi
          # A separate index stages the build tree; its .gitignore leaves out node_modules.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git --work-tree=.tmp/release add --all
          tree=$(git write-tree)
          refs=()
          git fetch --depth=1 origin release
          if [ "$tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "The release branch already has this build."
            commit=$(git rev-parse FETCH_HEAD)
          else
            commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "chore(release): build $GITHUB_SHA")
            refs+=("$commit:refs/heads/release")
          fi
          # Tag the first build of each version. One atomic push publishes the branch and the tag together, so a failed tag push cannot leave that build untagged. Tags never move: the push without --force fails instead of replacing a tag. An unchanged tree pushes only a missing tag, so a rerun adds a tag that an earlier run did not push.
          tag="v$(node -p "require('./.tmp/release/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
          else
            git tag -a "$tag" -m "$tag" "$commit"
            refs+=("refs/tags/$tag")
          fi
          if [ "${#refs[@]}" -gt 0 ]; then
            git push --atomic origin "${refs[@]}"
          fi
