packages:
  - packages/*
  - packages/extensions/*

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  unrs-resolver: false

catalog:
  "@earendil-works/pi-ai": ^0.87.1
  "@earendil-works/pi-coding-agent": ^0.87.1
  "@earendil-works/pi-tui": ^0.87.1
  "@git-diff-view/core": ^0.1.7
  "@stylistic/eslint-plugin": ^5.10.0
  "@types/node": ^24.13.3
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  vitest: 4.1.11
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.1'
  - '@earendil-works/pi-agent-core@0.87.1'
  - '@earendil-works/pi-ai@0.87.1'
  - '@earendil-works/pi-coding-agent@0.87.1'
  - '@earendil-works/pi-telemetry@0.87.1'
  - '@earendil-works/pi-tui@0.87.1'
  - '@voidzero-dev/vite-plus-core@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0-rc.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0-rc.0'
  - vite-plus@1.0.0-rc.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
