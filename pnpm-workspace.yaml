packages:
  - apps/*
  - packages/*
  - packages/extensions/*

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  unrs-resolver: false

catalog:
  "@earendil-works/pi-ai": ^1.5.2
  "@earendil-works/pi-coding-agent": ^1.5.2
  "@earendil-works/pi-tui": ^1.5.2
  "@stylistic/eslint-plugin": ^5.10.0
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/devtools-vite": 0.8.6
  "@tanstack/react-devtools": 0.10.14
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-router-devtools": 1.167.3
  "@tanstack/react-start": 1.169.5
  "@types/node": ^26.6.6
  "@types/proper-lockfile": 4.1.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  diff: 9.0.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.4.2
  fast-diff: ^1.3.0
  proper-lockfile: ^4.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typebox: 1.4.6
  typescript: ^7.0.2
  unbash: ^6.0.4
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  zod: ^4.6.7

catalogs:
  pi-host:
    "@earendil-works/pi-ai": "*"
    "@earendil-works/pi-coding-agent": "*"
    "@earendil-works/pi-tui": "*"
    typebox: "*"

minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - "@earendil-works/pi-coding-agent"
  - "@earendil-works/pi-codemode"
  - "@earendil-works/pi-mcp"
  - "@earendil-works/pi-schema"
  - "@earendil-works/pi-telemetry"
  - "@earendil-works/pi-tui"
  - "@voidzero-dev/vite-plus-core"
  - "@voidzero-dev/vite-plus-darwin-arm64"
  - "@voidzero-dev/vite-plus-darwin-x64"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu"
  - "@voidzero-dev/vite-plus-linux-arm64-musl"
  - "@voidzero-dev/vite-plus-linux-x64-gnu"
  - "@voidzero-dev/vite-plus-linux-x64-musl"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc"
  - "@voidzero-dev/vite-plus-win32-x64-msvc"
  - vite-plus
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
