packages:
  - packages/*
  - packages/extensions/*

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  unrs-resolver: false

catalog:
  "@earendil-works/pi-ai": ^0.87.1
  "@earendil-works/pi-coding-agent": ^0.87.1
  "@earendil-works/pi-tui": ^0.87.1
  "@git-diff-view/core": ^0.1.7
  "@stylistic/eslint-plugin": ^5.10.0
  "@types/node": ^26.6.2
  "@types/proper-lockfile": 4.1.4
  diff: 9.0.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.2.0
  proper-lockfile: ^4.1.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
  zod: ^4.6.5

catalogs:
  pi-host:
    "@earendil-works/pi-ai": "*"
    "@earendil-works/pi-coding-agent": "*"
    "@earendil-works/pi-tui": "*"

minimumReleaseAgeExclude:
  - "@earendil-works/chord"
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - "@earendil-works/pi-coding-agent"
  - "@earendil-works/pi-telemetry"
  - "@earendil-works/pi-tui"
  - "@voidzero-dev/vite-plus-core"
  - "@voidzero-dev/vite-plus-darwin-arm64"
  - "@voidzero-dev/vite-plus-darwin-x64"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu"
  - "@voidzero-dev/vite-plus-linux-arm64-musl"
  - "@voidzero-dev/vite-plus-linux-x64-gnu"
  - "@voidzero-dev/vite-plus-linux-x64-musl"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc"
  - "@voidzero-dev/vite-plus-win32-x64-msvc"
  - vite-plus
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
