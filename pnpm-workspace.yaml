  "@earendil-works/pi-coding-agent": ^1.6.0
  "@earendil-works/pi-tui": ^1.6.0
  "@stylistic/eslint-plugin": ^6.0.1
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/devtools-vite": 0.8.6
  "@tanstack/react-devtools": 0.10.14
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-router-devtools": 1.167.3
  "@tanstack/react-start": 1.169.5
  "@types/node": ^26.6.6
  "@types/proper-lockfile": 4.1.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  diff: 9.0.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.4.4
  eslint-plugin-slop: ^0.1.3
  fast-diff: ^1.3.0
  ignore: ^7.0.16
  proper-lockfile: ^4.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typebox: 1.4.7
  typescript: ^7.0.2
  unbash: ^6.0.4
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  zod: ^4.6.7

catalogs:
